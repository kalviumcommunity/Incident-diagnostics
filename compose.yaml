name: incident-diagnostics
services:
  app:
    image: incident-diagnostics:1.0.0
    build: .
    user: "10001:10001"
    ports: ["127.0.0.1:18084:8080"]
    environment:
      BIND_HOST: "127.0.0.1"
      APP_MODE: "assessment"
      STATELESS: "1"
      LOG_FILE: "/app/logs/requests.jsonl"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
